<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>后台设置 · UNT 产能识别</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top"><div class="wrap top-inner">
  <div class="brand"><span class="logo">UNT</span><span>后台设置</span></div>
  <a class="link" href="/">← 返回首页</a>
</div></header>
<main class="wrap" style="max-width:720px">

  <section class="card" id="login">
    <div class="card-head"><h2>登录</h2></div>
    <div class="form">
      <label>后台密码 <small>（.env 中的 ADMIN_PASSWORD）</small><input type="password" id="pwd" autocomplete="current-password"></label>
      <button class="primary" id="loginBtn" type="button">进入</button>
      <div class="msg bad" id="loginMsg"></div>
    </div>
  </section>

  <section class="card" id="panel" hidden>
    <div class="card-head"><h2>AI 接口</h2></div>
    <div class="form">
      <label>接口地址 Base URL <small>兼容 OpenAI 格式，填到 /v1 为止</small>
        <input id="baseUrl" placeholder="https://api.openai.com/v1"></label>
      <label>API Key <small id="keyHint"></small>
        <input id="apiKey" type="password" placeholder="留空表示不修改" autocomplete="off"></label>
      <label>模型名称 <small>必须是支持图片输入的视觉模型</small>
        <input id="model" placeholder="gpt-4o / qwen-vl-max / glm-4v-plus …"></label>
      <label>Temperature <small>建议 0，输出最稳定</small>
        <input id="temperature" type="number" step="0.1" min="0" max="2"></label>
      <label>补充提示词 <small>可选，会附加在内置提示词后面，例如本厂特有的批次号规则</small>
        <textarea id="extraPrompt" placeholder="例：批次号前缀只有 BE、BP 两种；型号只有 B228、B339、B342、B473、B586"></textarea></label>
      <div class="row">
        <button class="copy" id="save" type="button">保存</button>
        <button class="ghost" id="test" type="button">测试连接</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>
  </section>

  <section class="card" id="promptCard" hidden>
    <div class="card-head"><h2>内置提示词（只读）</h2></div>
    <pre class="prompt" id="prompt"></pre>
  </section>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let pwd = '';
  try { pwd = sessionStorage.getItem('adminPwd') || ''; } catch (_) {}
  const fields = ['baseUrl', 'apiKey', 'model', 'temperature', 'extraPrompt'];

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-admin-password': pwd } });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || json.reply || `请求失败 ${res.status}`);
    return json;
  }
  function fill(c) {
    $('baseUrl').value = c.baseUrl || '';
    $('model').value = c.model || '';
    $('temperature').value = c.temperature ?? 0;
    $('extraPrompt').value = c.extraPrompt || '';
    $('apiKey').value = '';
    $('keyHint').textContent = c.hasKey ? `当前：${c.apiKey}` : '尚未设置';
  }
  function values() { const o = {}; fields.forEach((f) => o[f] = $(f).value); return o; }
  function msg(t, ok) { $('msg').textContent = t; $('msg').className = 'msg ' + (ok ? 'ok' : 'bad'); }

  async function enter() {
    try {
      fill(await api('/api/admin/config'));
      $('prompt').textContent = (await api('/api/admin/prompt')).prompt;
      try { sessionStorage.setItem('adminPwd', pwd); } catch (_) {}
      $('login').hidden = true; $('panel').hidden = false; $('promptCard').hidden = false;
    } catch (e) { $('loginMsg').textContent = e.message; }
  }
  $('loginBtn').onclick = () => { pwd = $('pwd').value; enter(); };
  $('pwd').onkeydown = (e) => { if (e.key === 'Enter') $('loginBtn').click(); };
  $('save').onclick = async () => {
    try { fill(await api('/api/admin/config', { method: 'POST', body: JSON.stringify(values()) })); msg('已保存，立即生效', true); }
    catch (e) { msg(e.message); }
  };
  $('test').onclick = async () => {
    msg('测试中…', true);
    try { const r = await api('/api/admin/test', { method: 'POST', body: JSON.stringify(values()) }); msg(`连接成功，模型回复：${r.reply}`, true); }
    catch (e) { msg(e.message); }
  };
  if (pwd) enter();
})();
</script>
</body>
</html>
